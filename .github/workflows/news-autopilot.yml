name: NewsLightGG Photo Autopilot
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'data/editorial-queue/**'
      - 'photo_publish.py'
      - 'tests/test_photo_publish.py'
      - '.github/workflows/news-autopilot.yml'
permissions:
  contents: write
concurrency:
  group: newslightgg-news-autopilot
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check photo publisher
        run: |
          python -m unittest discover -s tests -p test_photo_publish.py -v
          python -m py_compile photo_publish.py
      - name: Configure receipt author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish one verified photo post without owner review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python photo_publish.py
      - name: Preserve delivery receipt on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: photo-recovery-${{ github.run_id }}
          path: data/photo-publications.json
          retention-days: 30
