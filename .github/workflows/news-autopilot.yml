name: NewsLightGG Autopilot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: newslightgg-news-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install free video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find, build and publish news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@newsLightGG"
          TELEGRAM_CHANNEL_SPOKEN_NAME: "Ньюс Лайт"
          MAX_POST_AGE_HOURS: "12"
          MIN_NEWS_SCORE: "4.0"
        run: python runner.py

      - name: Save published-news state
        if: success()
        run: |
          if git diff --quiet -- data/seen.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "Update published news state"
          git push
