name: NewsLightGG Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"
  push:
    branches: [main]
    paths:
      - 'text_autopost_runner.py'
      - 'autopost_news.py'
      - 'news_sources.py'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/news-autopilot.yml'

concurrency:
  group: newslightgg-news-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install news dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Telegram secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "TELEGRAM_BOT_TOKEN is missing" && exit 1)
          echo "Telegram secret is present."

      - name: Configure publication state author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find fresh news and publish text-only post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@newsLightGG'
          MAX_POST_AGE_HOURS: '18'
          MIN_NEWS_SCORE: '3.8'
        run: python text_autopost_runner.py
