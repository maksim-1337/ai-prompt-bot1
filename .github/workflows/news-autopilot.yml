name: NewsLightGG Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: newslightgg-news-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find, build and publish news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@newsLightGG"
          MAX_POST_AGE_HOURS: "10"
          MIN_NEWS_SCORE: "4.5"
        run: python styled_publish.py

      - name: Save published-news state
        if: success()
        run: |
          if git diff --quiet -- data/seen.json && test -z "$(git status --porcelain -- data/video-inbox.json)"; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/video-inbox.json
          git commit -m "Update published news state"
          git push
