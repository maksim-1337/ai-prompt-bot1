name: NewsLightGG Photo Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"
  push:
    branches: [main]
    paths:
      - 'data/editorial-queue/*.json'
      - 'photo_publish.py'
      - 'tests/test_photo_publish.py'
      - '.github/workflows/news-autopilot.yml'

concurrency:
  group: newslightgg-news-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test photo delivery and duplicate protection
        run: python -m unittest discover -s tests -p test_photo_publish.py -v
      - name: Configure state author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish at most one verified photo post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python photo_publish.py
      - name: Preserve receipt if state push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: photo-publication-receipt-${{ github.run_id }}
          path: data/photo-publications.json
          retention-days: 14
