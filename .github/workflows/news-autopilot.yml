name: NewsLightGG Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"
  push:
    branches: [main]
    paths:
      - 'autopost_news.py'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/news-autopilot.yml'

concurrency:
  group: newslightgg-news-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install news dependencies
        run: python -m pip install -r requirements.txt

      - name: Self-test branded cover and Telegram caption
        run: python autopost_news.py --self-test

      - name: Configure publication state author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find and publish one fresh branded news post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@newsLightGG'
          MAX_POST_AGE_HOURS: '10'
          MIN_NEWS_SCORE: '4.5'
        run: python autopost_news.py
