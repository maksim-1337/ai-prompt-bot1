name: NewsLight Styled Test

on:
  push:
    branches: ["main"]

concurrency:
  group: newslightgg-styled-test
  cancel-in-progress: true

jobs:
  test-post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send styled Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@newsLightGG"
        run: python styled_test_publish.py
