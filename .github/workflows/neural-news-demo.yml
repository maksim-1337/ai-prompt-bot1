name: Neural News Demo

on:
  push:
    paths:
      - '.github/workflows/neural-news-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install video dependencies
        run: |
          pip install -r requirements-studio.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy omegaconf
      - name: Render real news sample with natural male Russian voice
        env:
          SILERO_SPEAKER: aidar
        run: python -m studio.reference_silero
      - uses: actions/upload-artifact@v4
        with:
          name: male-news-video
          path: |
            output/male-news/short.mp4
            output/male-news/cover.jpg
            output/male-news/manifest.json
          retention-days: 3
