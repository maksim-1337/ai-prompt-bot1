name: Neural News Demo

on:
  push:
    paths:
      - '.github/workflows/neural-news-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install video dependencies
        run: pip install -r requirements-studio.txt
      - name: Render real news sample with clear Russian voice
        run: python -m studio.reference_gtts
      - uses: actions/upload-artifact@v4
        with:
          name: neural-news-video
          path: |
            output/neural-news/short.mp4
            output/neural-news/cover.jpg
            output/neural-news/manifest.json
          retention-days: 3

# rebuild after duration-probe fix
