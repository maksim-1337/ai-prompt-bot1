name: NewsLightGG Cleanup Test Post

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-post-once.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete test Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ.get('TELEGRAM_BOT_TOKEN','').strip()
          if not token:
              raise SystemExit('TELEGRAM_BOT_TOKEN missing')
          data=urllib.parse.urlencode({'chat_id':'@newsLightGG','message_id':'19'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/deleteMessage',data=data)
          with urllib.request.urlopen(req,timeout=30) as r:
              payload=json.loads(r.read().decode())
          print('Deleted:',payload.get('ok'))
          if not payload.get('ok'):
              raise SystemExit(payload.get('description','Telegram delete failed'))
          PY
