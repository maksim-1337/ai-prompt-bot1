name: Video Studio Checks
on:
  push:
    paths: ['studio/**', 'tests/**', 'requirements-studio.txt', '.github/workflows/studio-checks.yml']
  pull_request:
    paths: ['studio/**', 'tests/**', 'requirements-studio.txt', '.github/workflows/studio-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-studio.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m studio demo
      - uses: actions/upload-artifact@v4
        with:
          name: studio-demo
          path: |
            output/demo/short.mp4
            output/demo/cover.jpg
            output/demo/manifest.json
          retention-days: 7
