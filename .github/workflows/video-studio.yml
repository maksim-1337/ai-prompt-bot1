name: NewsLight Video Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

# News producer and publisher must never overlap a state-writing transaction.
concurrency:
  group: newslightgg-news-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  studio:
    if: vars.STUDIO_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install studio dependencies
        run: pip install -r requirements-studio.txt
      - name: Check approvals, render and publish approved videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@newsLightGG"
          GH_TOKEN: ${{ github.token }}
          STUDIO_STATE_KEY: ${{ secrets.STUDIO_STATE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # Optional paid fallback. Direct mode below does not require Ayrshare.
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}

          # Official direct publishing credentials.
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

          # Keep review until the owner finishes one-time social account authorization.
          STUDIO_PUBLISHER: ${{ vars.STUDIO_PUBLISHER || 'review' }}
          STUDIO_TARGETS: ${{ vars.STUDIO_TARGETS || 'youtube,instagram,tiktok,facebook' }}
          STUDIO_ACCOUNT_LABEL: ${{ vars.STUDIO_ACCOUNT_LABEL || 'Аккаунты ещё не подключены' }}
          STUDIO_VISIBILITY: ${{ vars.STUDIO_VISIBILITY || 'public' }}
          STUDIO_DAILY_LIMIT: ${{ vars.STUDIO_DAILY_LIMIT || '2' }}
          # Softer, clearer Russian neural narration. Can still be overridden in Variables.
          STUDIO_VOICE: ${{ vars.STUDIO_VOICE || 'ru-RU-SvetlanaNeural' }}
          STUDIO_TIKTOK_PRIVACY: ${{ vars.STUDIO_TIKTOK_PRIVACY || 'PUBLIC_TO_EVERYONE' }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v25.0' }}
        run: python -m studio.direct_run
